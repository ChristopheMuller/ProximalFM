# Per-parameter transfer/freeze rules applied when building the model.
#
# Matching: LONGEST matching prefix wins; "default" applies to anything unmatched.
# States:
#   finetune -> weights are loaded from the checkpoint, requires_grad = True
#   freeze   -> weights are loaded from the checkpoint, requires_grad = False
#   scratch  -> weights are NOT loaded (stay randomly initialised), requires_grad = True
#               (any value other than finetune/freeze is treated as scratch)
#
# Two things this file does NOT do, despite how it reads:
#  - the freezing pass runs even with no checkpoint, so `default: freeze` freezes a
#    from-scratch run too. Use `default: finetune` for training from scratch.
#  - "default" also governs parameters whose shape did not match the checkpoint and were
#    therefore left random. A bare `default: freeze` with no rule for a changed head
#    means the fresh head is frozen as well and nothing trains at all -- always give a
#    changed head its own rule.
#
# Select a different file with --transfer_rules; transfer_rules_rung{0,1,2,3}.yaml are
# the unfreezing ladder for fitting a new head on a frozen backbone.

transfer_rules:
  default: "finetune"
  # Final decoder Linear (d_model*2 -> out_dim): the only layer whose shape changes
  # when the head changes, e.g. bins_po (2*nbins) -> cate_single (nbins).
  "icl_predictor.decoder.2.": "finetune"
