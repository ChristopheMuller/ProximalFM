training:
  seed: 1234
  epochs: 100
  lr: 0.0003
  warmup_steps: 1000
  weight_decay: 0.0001
  clip_grad: 1.5
  early_stop: 15          # patience in epochs before early stopping
  val_freq: 3
  save_freq: 10           # save a checkpoint every N epochs
  save_dir: "checkpoints"
  log_dir: "runs/proximalfm"
  device: "mps"           # "cuda" | "mps" | "cpu"
  gpu: 0                  # GPU index (only used when device == "cuda")
  zw_mask_prob: 0.0       # probability of masking Z and W type tokens jointly
  x_mask_prob: 0.0        # probability of masking X type tokens

model:
  ninp: 192               # embedding dimension (d_model)
  nhead: 6                # number of attention heads
  nhid: 768               # feedforward hidden dimension (4 * ninp)
  nlayers: 6              # number of transformer layers
  layer_norm_with_elementwise_affine: true
  dtype: "float32"        # "float32" | "bfloat16"

data:
  batch_size: 32            # number of episodes per batch
  samples_per_episode: 128 # rows (observations) per episode / context window
  context_fraction: 0.75   # fraction of rows used as context; rest are query targets
  train_episodes: 500     # episodes constituting one training epoch
  val_episodes: 500        # episodes for validation
  num_workers: 4           # DataLoader worker processes (0 = main process only)

prior:
  d_x: 5    # baseline covariates X
  d_z: 2    # treatment-inducing proxy Z
  d_w: 2    # outcome-inducing proxy W
  d_u: 1    # latent confounder U (never observed by the model)