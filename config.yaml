training:
  seed: 42
  epochs: 100
  lr: 0.003
  weight_decay: 0.0001
  clip_grad: 1.0
  early_stop: 15          # patience in epochs before early stopping
  save_freq: 10           # save a checkpoint every N epochs
  save_dir: "checkpoints"
  log_dir: "runs/proximalfm"
  device: "mps"          # "cuda" | "mps" | "cpu"
  gpu: 0                  # GPU index (only used when device == "cuda")
  # CFG-style variable-type masking (Section 5 of the paper).
  # Set to 0.0 to disable masking during early training, then increase.
  zw_mask_prob: 0.1       # probability of masking Z and W type tokens jointly
  x_mask_prob: 0.0        # probability of masking X type tokens

model:
  ninp: 32               # embedding dimension (d_model)
  nhead: 4                # number of attention heads
  nhid: 128               # feedforward hidden dimension (4 * ninp)
  nlayers: 6             # number of transformer layers
  layer_norm_with_elementwise_affine: true

data:
  batch_size: 8          # number of episodes per batch
  samples_per_episode: 256  # rows (observations) per episode / context window
  context_fraction: 0.8   # fraction of rows used as context; rest are query targets
  train_episodes: 1000   # episodes constituting one training epoch
  val_episodes: 500      # episodes for validation
  num_workers: 4          # DataLoader worker processes (0 = main process only)

prior:
  # Dimensionalities must satisfy d_z >= d_u and d_w >= d_u (completeness condition)
  d_x: 5    # baseline covariates X
  d_z: 2    # treatment-inducing proxy Z
  d_w: 2    # outcome-inducing proxy W
  d_u: 1    # latent confounder U (never observed by the model)