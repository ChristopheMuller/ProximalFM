training:
  seed: 1234
  epochs: 200
  lr: 0.0004
  warmup_steps: 1000
  warmup_epochs: 50
  weight_decay: 0.0001
  clip_grad: 1.5
  early_stop: 15          # patience in epochs before early stopping
  val_freq: 2
  save_freq: 10           # save a checkpoint every N epochs
  save_dir: "checkpoints"
  log_dir: "runs/proximalfm"
  device: "mps"           # "cuda" | "mps" | "cpu"
  gpu: 0                  # GPU index (only used when device == "cuda")
  zw_mask_prob: 0.0       # probability of masking Z and W type tokens jointly
  x_mask_prob: 0.0        # probability of masking X type tokens
  exp_name: "run1_256"

model:
  col_nhead: 8
  col_num_blocks: 6
  dtype: float32
  embed_dim: 64
  icl_nhead: 8
  icl_num_blocks: 14
  row_nhead: 8
  row_num_blocks: 6      # "float32" | "bfloat16"

data:
  batch_size: 16           # number of episodes per batch
  samples_per_episode: 256 # rows (observations) per episode / context window
  context_fraction: 0.85   # fraction of rows used as context; rest are query targets
  train_episodes: 600      # episodes constituting one training epoch
  reset_freq_train: 1
  val_episodes: 500        # episodes for validation
  num_workers: 4           # DataLoader worker processes (0 = main process only)

prior:
  type : "linear"
  d_x            : 1
  d_u            : 2
  d_z            : 2
  d_w            : 2
  noise_scale_w  : 1
  noise_scale_z  : 1
  noise_scale_x  : 1
  temperature    : 1