training:
  clip_grad: 1.5
  device: cuda
  early_stop: 30
  epochs: 1500
  exp_name: "test"
  gpu: 0
  log_dir: "runs/"
  group_wandb: "group1"
  lr: 0.0003
  save_dir: "checkpoints"
  save_freq: 10
  seed: 1234
  start_checkpoint: null
  val_freq: 4
  warmup_epochs: 100
  warmup_steps: 1000
  weight_decay: 0.0002
  x_mask_prob: 0.0
  zw_mask_prob: 0.0

model:
  col_nhead: 2
  col_num_blocks: 6
  dist_embed_n_inducing: 16
  dist_embed_nhead: 2
  dist_embed_num_blocks: 2
  dtype: float32
  embed_dim: 64
  feature_group_size_w: 2
  feature_group_size_x: 3
  feature_group_size_z: 2
  icl_nhead: 2
  icl_num_blocks: 6
  n_cls_cols: 4
  n_cls_rows: 128
  n_gmm_components: 3
  row_nhead: 2
  row_num_blocks: 10
  type: "mse"
  use_distribution_aware_embedding: true

data:
  batch_size: 16
  max_context_size: 512
  min_context_size: 512
  num_workers: 4
  reset_freq_train: 1
  test_size: 64
  train_episodes: 1000
  val_episodes: 1000

prior:
  confounding_strength: 1
  d_u: 2
  d_w: 3
  d_x: 5
  d_z: 3
  noise_scale_w: 1
  noise_scale_x: 1
  noise_scale_z: 1
  temperature: 2
  type: "bnn_complete"


val_prior:
  confounding_strength: 1
  d_u: 2
  d_w: 3
  d_x: 5
  d_z: 3
  noise_scale_w: 1
  noise_scale_x: 1
  noise_scale_z: 1
  temperature: 2
  type: "bnn_complete"
