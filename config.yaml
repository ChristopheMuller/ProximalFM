training:
  seed: 1234
  epochs: 100
  lr: 0.0003
  warmup_steps: 1000
  warmup_epochs: 50
  weight_decay: 0.0001
  clip_grad: 1.5
  early_stop: 15          # patience in epochs before early stopping
  val_freq: 3
  save_freq: 10           # save a checkpoint every N epochs
  save_dir: "checkpoints"
  log_dir: "runs/proximalfm"
  device: "mps"           # "cuda" | "mps" | "cpu"
  gpu: 0                  # GPU index (only used when device == "cuda")
  zw_mask_prob: 0.0       # probability of masking Z and W type tokens jointly
  x_mask_prob: 0.0        # probability of masking X type tokens
  exp_name: "cate_run_linear"

model:
  out_dim: 2
  embed_dim: 64
  col_num_blocks: 3
  row_num_blocks: 3
  icl_num_blocks: 12
  col_nhead: 8
  row_nhead: 8
  icl_nhead: 8
  dtype: "float32"        # "float32" | "bfloat16"

data:
  batch_size: 16           # number of episodes per batch
  samples_per_episode: 64  # rows (observations) per episode / context window
  context_fraction: 0.75   # fraction of rows used as context; rest are query targets
  train_episodes: 2000     # episodes constituting one training epoch
  val_episodes: 500        # episodes for validation
  num_workers: 4           # DataLoader worker processes (0 = main process only)

prior:
  type : "linear"
  d_x            : 1
  d_u            : 2
  d_z            : 2
  d_w            : 2
  noise_scale_w  : 1
  noise_scale_z  : 1
  noise_scale_x  : 1
  normalize_episode : False
  temperature    : 1