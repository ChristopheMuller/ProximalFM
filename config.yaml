training:
  seed: 1234
  epochs: 1500
  lr: 0.0003
  warmup_steps: 1000
  warmup_epochs: 100
  weight_decay: 0.0002
  clip_grad: 1.5
  early_stop: 30          # patience in epochs before early stopping
  val_freq: 4
  save_freq: 10           # save a checkpoint every N epochs
  save_dir: "checkpoints"
  start_checkpoint: null
  log_dir: "runs/bnn_complete"
  device: "mps"           # "cuda" | "mps" | "cpu"
  gpu: 0                  # GPU index (only used when device == "cuda")
  zw_mask_prob: 0.0       # probability of masking Z and W type tokens jointly
  x_mask_prob: 0.0        # probability of masking X type tokens
  exp_name: "bnn_complete__distriEmbed"

model:
  type: "gmm"
  dtype: float32
  n_gmm_components: 3
  col_nhead: 2
  icl_nhead: 2
  row_nhead: 2
  embed_dim: 64
  icl_num_blocks: 8
  row_num_blocks: 8
  col_num_blocks: 8
  feature_group_size_x: 3
  feature_group_size_w: 2
  feature_group_size_z: 2
  n_cls_cols: 4
  n_cls_rows: 64
  use_distribution_aware_embedding: true
  dist_embed_num_blocks: 2
  dist_embed_n_inducing: 16
  dist_embed_nhead: 2

data:
  batch_size: 16             # number of episodes per batch
  min_context_size: 256
  max_context_size: 256       # maximum number of rows used as context
  test_size: 64             # number of rows used as query targets
  train_episodes: 1000       # episodes constituting one training epoch
  reset_freq_train: 1       # frequency (in episodes) to replace episodes in the training set with new ones (0 = never replace)
  val_episodes: 500         # episodes for validation
  num_workers: 4            # DataLoader worker processes (0 = main process only)

prior:
  type : "bnn_complete"
  d_x            : 3
  d_u            : 2
  d_z            : 2
  d_w            : 2
  noise_scale_w  : 1
  noise_scale_z  : 1
  noise_scale_x  : 1
  temperature    : 2
  confounding_strength: 1

val_prior:
  type : "bnn_complete"
  d_x            : 3
  d_u            : 2
  d_z            : 2
  d_w            : 2
  noise_scale_w  : 1
  noise_scale_z  : 1
  noise_scale_x  : 1
  temperature    : 2
  confounding_strength: 1
