# config_stress.yaml
# ─────────────────────────────────────────────────────────────────────────────
# ProximalFM — stress-test configuration
#
# Goals:
#   • Tiny model  →  fast iteration (seconds, not minutes)
#   • float32     →  easier debugging (NaN / Inf visible earlier than bfloat16)
#   • CPU         →  fully deterministic across machines
#   • num_workers = 0  →  no subprocess spawning, clean tracebacks
#
# How to run:
#   python -m proximalfm.StressTest --config config_stress.yaml
# ─────────────────────────────────────────────────────────────────────────────

training:
  seed: 42
  device: "mps"           # cpu = deterministic; change to "mps"/"cuda" to smoke-test on GPU

model:
  ninp: 32                # keep identical to production so weight shapes match
  nhead: 1
  nhid: 64
  nlayers: 6
  layer_norm_with_elementwise_affine: true
  dtype: "float32"        # float32 here — bfloat16 hides NaNs that would fail the sanity check

data:
  samples_per_episode: 128    # small N → fast forward pass
  context_fraction: 0.75     # 48 context rows, 16 query rows
  # The fields below are not used by StressTest.py directly but kept for
  # compatibility if you ever pass this config to the standard CATETrainer.
  batch_size: 1
  train_episodes: 1
  val_episodes: 1
  num_workers: 0

prior:
  d_x: 5
  d_z: 2
  d_w: 2
  d_u: 1

# ─────────────────────────────────────────────────────────────────────────────
# Stress-test knobs
# ─────────────────────────────────────────────────────────────────────────────
stress_test:
  # Number of gradient steps used for checks 3, 4, and 5.
  # 300 is usually enough to observe clear convergence on N=64 episodes.
  overfit_steps: 1000

  # Learning rate for the overfit loops.
  # Higher than production to converge faster; weight_decay is disabled in
  # the overfit loop so this won't cause instability on a single episode.
  overfit_lr: 0.002

  # Check 3 — single-episode overfit
  # The NLL loss must drop by at least this fraction relative to the initial loss.
  min_relative_decrease: 0.50      # 50 % relative decrease

  # The absolute final NLL must be at or below this value.
  # A Gaussian NLL of ~0 means mean ≈ target and std has been calibrated.
  # Anything positive but small (< 0.5) is already a healthy sign.
  loss_target: 0.5

  # Check 4 — trivial CATE recovery
  # Ground-truth ITE injected into the synthetic batch.
  trivial_ite_value: 1.0
  # Maximum allowed |predicted_mean - trivial_ite_value| after overfitting.
  trivial_tol_mean: 0.15