# ─────────────────────────────────────────────────────────────────────────────
# bench_config.yaml — Single source of truth for the entire benchmark.
# ─────────────────────────────────────────────────────────────────────────────

# ── Data ──────────────────────────────────────────────────────────────────────
data:
  source: generate
  output_dir: results/test

  # ── Dataset sizes ────────────────────────────────────────────────────────
  n_rows: 512    # context samples shown to each estimator
  n_batch: 20    # number of independent datasets (episodes)

  # ── Prior (only used when source=generate; paste the one from the checkpoints)
  prior:
    batch_size: 1
    batch_size_per_gp: 1
    min_dim_U: 1
    max_dim_U: 1
    min_dim_W: 1
    max_dim_W: 1
    min_dim_Z: 1
    max_dim_Z: 1
    min_dim_X: 2
    max_dim_X: 2
    min_seq_len: None
    max_seq_len: 512
    log_seq_len: False
    seq_len_per_gp: False
    min_train_size: 0.8
    max_train_size: 0.95
    replay_small: False
    prior_type: "mlp_scm"
    device: "cpu"


# ── Execution ─────────────────────────────────────────────────────────────────
run:
  seed:      999999999    # needs to be large enough to be sure not to use same seeds as during the training!
  n_workers: 6
  device: mps
  force_rerun: false


# ── Methods ───────────────────────────────────────────────────────────────────
methods:

  # ── S-Learner baselines ──────────────────────────────────────────────────
  - name: S-OLS
    cls:   S_Learner
    base:  linear
    use_W: true
    use_Z: true

  - name: S-OLS+AX
    cls:   S_Learner
    base:  linear
    use_W: true
    use_Z: true
    interactions: true

  - name: S-RF
    cls:   S_Learner
    base:  rf
    use_W: true
    use_Z: true

  - name: S-TabICL
    cls:   S_Learner
    base:  tabicl
    use_W: true
    use_Z: true

  # ── T-Learner baselines ──────────────────────────────────────────────────
  - name: T-OLS
    cls:   T_Learner
    base:  linear
    use_W: true
    use_Z: true

  - name: T-RF
    cls:   T_Learner
    base:  rf
    use_W: true
    use_Z: true

  - name: T-TabICL
    cls:   T_Learner
    base:  tabicl
    use_W: true
    use_Z: true

  # ── X-Learner baselines ──────────────────────────────────────────────────
  - name: X-OLS
    cls:   X_Learner
    base:  linear
    use_W: true
    use_Z: true
    interactions: false

  - name: X-OLS+AX
    cls:   X_Learner
    base:  linear
    use_W: true
    use_Z: true
    interactions: true

  - name: X-RF
    cls:   X_Learner
    base:  rf
    use_W: true
    use_Z: true
    interactions: false

  - name: X-TabICL
    cls:   X_Learner
    base:  tabicl
    use_W: true
    use_Z: true
    interactions: false

  # ── Proximal baselines ───────────────────────────────────────────────────
  - name: P2SLS
    cls:          P2SLS
    interactions: false

  - name: P2SLS+AX
    cls:          P2SLS
    interactions: true

  - name: KPV-ATE
    cls: NMMRWrappers
    model_type: KernelPV
    estimate_cate: false
    lam1: 0.01
    lam2: 0.01
    split_ratio: 0.5

  - name: KPV-CATE
    cls: NMMRWrappers
    model_type: KernelPV
    estimate_cate: true
    lam1: 0.01
    lam2: 0.01
    split_ratio: 0.5

  - name: PMMR-ATE
    cls: NMMRWrappers
    model_type: PMMR
    estimate_cate: false
    lam1: 0.01

  - name: PMMR-CATE
    cls: NMMRWrappers
    model_type: PMMR
    estimate_cate: true
    lam1: 0.01

  - name: NMMR-U
    cls: NMMR
    loss_name: U_statistic

  - name: NMMR-V
    cls: NMMR
    loss_name: V_statistic

  # - name: DFPV-ATE
  #   cls: DFPV

  # ── Tabular Causal Models ─────────────────────────────────────────────────
  - name: CausalFM
    cls:  CausalFM
    checkpoint: "CausalFM/checkpoints/checkpoints_standard/best_model.pth"
    use_W: false
    use_Z: false

  - name: DoPFN
    cls:  DoPFN
    use_W: true
    use_Z: true
  
  - name: CausalPFN
    cls:  CausalPFN
    use_W: true
    use_Z: true

# ── Neural model checkpoints ─────────────────────────────────────────────────

models:
  - name:       ProximalFM
    checkpoint: check_2/
