# ─────────────────────────────────────────────────────────────────────────────
# bench_config.yaml — Single source of truth for the entire benchmark.
# ─────────────────────────────────────────────────────────────────────────────

# ── Data ──────────────────────────────────────────────────────────────────────
data:
  source: generate
  output_dir: results/tobedeleted

  # ── Dataset sizes ────────────────────────────────────────────────────────
  n_rows: 512    # context samples shown to each estimator
  n_batch: 50    # number of independent datasets (episodes)
  prop_train: 0.75

  # ── Prior (only used when source=generate; paste the one from the checkpoints)
  prior:
    batch_size: 1
    batch_size_per_gp: 1
    min_dim_U: 3
    max_dim_U: 3
    min_dim_W: 3
    max_dim_W: 3
    min_dim_Z: 3
    max_dim_Z: 3
    min_dim_X: 1
    max_dim_X: 1
    min_seq_len: None
    max_seq_len: 512
    log_seq_len: False
    seq_len_per_gp: False
    min_train_size: 0.5
    max_train_size: 0.95
    replay_small: False
    prior_type: "mlp_scm"
    device: "cpu"


# ── Execution ─────────────────────────────────────────────────────────────────
run:
  seed:      999999999
  n_workers: 6
  device: mps
  force_rerun: false


# ── Methods ───────────────────────────────────────────────────────────────────
methods:

  # ── S-Learner baselines ──────────────────────────────────────────────────
  - name: S-OLS
    cls:   S_Learner
    base:  linear
    use_W: true
    use_Z: true

  - name: S-OLS+AX
    cls:   S_Learner
    base:  linear
    use_W: true
    use_Z: true
    interactions: true

  - name: S-RF
    cls:   S_Learner
    base:  rf
    use_W: true
    use_Z: true

  # - name: S-TabICL-Xonly
  #   cls:   S_Learner
  #   base:  tabicl
  #   use_W: false
  #   use_Z: false

  # - name: S-TabICL-XW
  #   cls:   S_Learner
  #   base:  tabicl
  #   use_W: true
  #   use_Z: false

  - name: S-TabICL
    cls:   S_Learner
    base:  tabicl
    use_W: true
    use_Z: true

  - name: S-TabICL-Oracle
    cls:   S_Learner
    base:  tabicl
    use_W: true
    use_Z: false
    is_oracle: true

  # ── T-Learner baselines ──────────────────────────────────────────────────
  - name: T-OLS
    cls:   T_Learner
    base:  linear
    use_W: true
    use_Z: true

  - name: T-RF
