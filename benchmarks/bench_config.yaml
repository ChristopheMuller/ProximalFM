  # ── Proximal baselines ───────────────────────────────────────────────────
  - name: P2SLS
    cls:          P2SLS
    interactions: false

  - name: P-RF
    cls:          PLearner
    base:         rf
    n_splits:     5
    q_clip:       [-10.0, 10.0]
    refit_full_nuisance: false

  - name: KPV
    cls:         KernelPV
    split_ratio: 0.5

  - name: PMMR
    cls:        PMMR
    lam1:       1.0

  - name: NMMR
    cls:        NMMR

  - name: DFPV
    cls:        DFPV


  # ── Tabular Causal Models ─────────────────────────────────────────────────
  - name: CausalFM
    cls:  CausalFM
    checkpoint: "CausalFM/checkpoints/checkpoints_standard/best_model.pth"
    use_W: false
    use_Z: false

  - name: DoPFN
    cls:  DoPFN
    use_W: false
    use_Z: false

  - name: CausalPFN
    cls:  CausalPFN
    use_W: false
    use_Z: false


# ── Neural model checkpoints ─────────────────────────────────────────────────

models:
  - name:       ProximalFM_check9
    checkpoint: check9/
