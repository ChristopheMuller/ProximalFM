# ─────────────────────────────────────────────────────────────────────────────
# bench_config.yaml — Single source of truth for the entire benchmark.
# ─────────────────────────────────────────────────────────────────────────────

# ── Data ──────────────────────────────────────────────────────────────────────
data:
  load: synthetic/validation_datasets/benchmark
  output_dir: synthetic/validation_datasets/benchmark

  # ── Dataset sizes ────────────────────────────────────────────────────────
  n_rows: 500
  n_batch: 100
  prop_train: 0.75

  # ── Prior (only used when source=generate; paste the one from the checkpoints)
  prior:
    batch_size: 1
    batch_size_per_gp: 1
    min_dim_U: 1
    max_dim_U: 1
    min_dim_W: 1
    max_dim_W: 1
    min_dim_Z: 1
    max_dim_Z: 1
    min_dim_X: 1
    max_dim_X: 1
    min_seq_len: None
    max_seq_len: 2048
    log_seq_len: False
    seq_len_per_gp: False
    min_train_size: 0.5
    max_train_size: 0.95
    replay_small: False
    prior_type: "mlp_scm"
    device: "cpu"


# ── Execution ─────────────────────────────────────────────────────────────────
run:
  seed:      999999999
  n_workers: 6
  device: mps
  force_rerun: false


# ── Methods ───────────────────────────────────────────────────────────────────
methods:

  # ── S-Learner baselines ──────────────────────────────────────────────────
  - name: S-OLS
    cls:   S_Learner
    base:  linear
    use_W: false
    use_Z: false

  - name: S-OLS+AX
    cls:   S_Learner
    base:  linear
    use_W: false
    use_Z: false
    interactions: true

  - name: S-RF
    cls:   S_Learner
    base:  rf
    use_W: false
    use_Z: false

  - name: S-TabICL
    cls:   S_Learner
    base:  tabicl
    use_W: false
    use_Z: false

  - name: S-TabICL-Oracle
    cls:   S_Learner
    base:  tabicl
    use_W: false
    use_Z: false
    is_oracle: true

  # ── T-Learner baselines ──────────────────────────────────────────────────
  - name: T-OLS
    cls:   T_Learner
    base:  linear
    use_W: false
    use_Z: false

  - name: T-RF
    cls:   T_Learner
    base:  rf
    use_W: false
    use_Z: false

  # - name: T-TabICL
  #   cls:   T_Learner
  #   base:  tabicl
  #   use_W: false
  #   use_Z: false

  # - name: T-TabICL-Oracle
  #   cls:   T_Learner
  #   base:  tabicl
  #   use_W: false
  #   use_Z: false
  #   is_oracle: true

  # ── X-Learner baselines ──────────────────────────────────────────────────
  - name: X-RF
    cls:   X_Learner
    base:  rf
    use_W: false
    use_Z: false
    interactions: false

  # - name: X-TabICL
  #   cls:   X_Learner
  #   base:  tabicl
  #   use_W: false
  #   use_Z: false

  # - name: X-TabICL-Oracle
  #   cls:   X_Learner
  #   base:  tabicl
  #   use_W: false
  #   use_Z: false
  #   is_oracle: true

  # ── Proximal baselines ───────────────────────────────────────────────────
  - name: P2SLS
    cls:          P2SLS
    interactions: false

  - name: P-RF
    cls:          PLearner
    base:         rf
    n_splits:     2
    q_clip:       [-10.0, 10.0]
    refit_full_nuisance: false

  - name: KPV-XW
    cls:         KernelPV
    strategy:    paired

  - name: KPV-X-Wind
    cls:         KernelPV
    strategy:    independent

  - name: KPV-X-cond
    cls:         KernelPV
    strategy:    conditional

  - name: KPV-ATE
    cls:         KernelPV
    strategy:    marginal

  - name: PMMR-XW
    cls:        PMMR
    strategy:  paired

  - name: PMMR-X-Wind
    cls:        PMMR
    strategy:   independent

  - name: PMMR-X-cond
    cls:        PMMR
    strategy:   conditional

  - name: PMMR-ATE
    cls:        PMMR
    strategy:   marginal

  - name: NMMR-U
    cls:        NMMR
    loss:       "u_stat"
    strategy:   paired

  - name: NMMR-V
    cls:        NMMR
    loss:       "v_stat"
    strategy:   paired

  # - name: DFPV-XW
  #   cls:        DFPV
  #   strategy:   paired

  # - name: DFPV-X-Wind
  #   cls:        DFPV
  #   strategy:   independent

  # - name: DFPV-X-cond
  #   cls:        DFPV
  #   strategy:   conditional

  # - name: DFPV-ATE
  #   cls:        DFPV
  #   strategy:   marginal

  # - name: CausalForest
  #   cls:  CausalForest
  #   n_trees: 100
  #   min_leaf_size: 10
  #   max_depth: 10
  #   subsample_ratio: 0.7
  #   use_W: false
  #   use_Z: false
  #   n_jobs: 1

  # ── Tabular Causal Models ─────────────────────────────────────────────────
  - name: CausalFM
    cls:  CausalFM
    checkpoint: "CausalFM/checkpoints/checkpoints_standard/best_model.pth"
    use_W: false
    use_Z: false

  # - name: DoPFN
  #   cls:  DoPFN
  #   use_W: false
  #   use_Z: false

  - name: CausalPFN
    cls:  CausalPFN
    use_W: false
    use_Z: false

# ── Neural model checkpoints ─────────────────────────────────────────────────

models:
  - name:       ProximalFM
    checkpoint: mc_run_1/
    all: false

  - name:       ProximalFM2
    checkpoint: mc_run_2/
    all: false