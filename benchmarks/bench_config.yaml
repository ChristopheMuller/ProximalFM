# ─────────────────────────────────────────────────────────────────────────────
# bench_config.yaml — Single source of truth for the entire benchmark.
# ─────────────────────────────────────────────────────────────────────────────

# ── Data ──────────────────────────────────────────────────────────────────────
data:
  source: generate
  output_dir: results/test

  # ── Dataset sizes ────────────────────────────────────────────────────────
  n_train: 500    # context samples shown to each estimator
  n_test:  500     # query samples for evaluation  (n_test > 1 enables CATE R²)
  n_batch: 10    # number of independent datasets (episodes)

  # ── Prior (only used when source=generate; paste the one from the checkpoints)
  prior:
    confounding_strength: 1
    d_u: 2
    d_w: 3
    d_x: 5
    d_z: 3
    noise_scale_w: 1
    noise_scale_x: 1
    noise_scale_z: 1
    temperature: 2
    type: cate_linear


# ── Execution ─────────────────────────────────────────────────────────────────
run:
  seed:      999999999    # needs to be large enough to be sure not to use same seeds as during the training!
  n_workers: 8
  device: mps
  force_rerun: false


# ── Methods ───────────────────────────────────────────────────────────────────
methods:

  # ── S-Learner baselines ──────────────────────────────────────────────────
  - name: S-OLS
    cls:   S_Learner
    base:  linear
    use_W: true
    use_Z: true

  - name: S-OLS+AX
    cls:   S_Learner
    base:  linear
    use_W: true
    use_Z: true
    interactions: true

  - name: S-RF
    cls:   S_Learner
    base:  rf
    use_W: true
    use_Z: true

  # - name: S-TabICL
  #   cls:   S_Learner
  #   base:  tabicl
  #   use_W: true
  #   use_Z: true

  # ── T-Learner baselines ──────────────────────────────────────────────────
  - name: T-OLS
    cls:   T_Learner
    base:  linear
    use_W: true
    use_Z: true

  - name: T-RF
    cls:   T_Learner
    base:  rf
    use_W: true
    use_Z: true

  # - name: T-TabICL
  #   cls:   T_Learner
  #   base:  tabicl
  #   use_W: true
  #   use_Z: true

  # ── X-Learner baselines ──────────────────────────────────────────────────
  - name: X-OLS
    cls:   X_Learner
    base:  linear
    use_W: true
    use_Z: true
    interactions: false

  - name: X-OLS+AX
    cls:   X_Learner
    base:  linear
    use_W: true
    use_Z: true
    interactions: true

  - name: X-RF
    cls:   X_Learner
    base:  rf
    use_W: true
    use_Z: true
    interactions: false

  # ── Proximal baselines ───────────────────────────────────────────────────
  - name: P2SLS
    cls:          P2SLS
    interactions: false

  - name: P2SLS+AX
    cls:          P2SLS
    interactions: true

  - name: KPV-ATE
    cls: NMMRWrappers
    model_type: KernelPV
    estimate_cate: false
    lam1: 0.01
    lam2: 0.01
    split_ratio: 0.5

  - name: KPV-CATE
    cls: NMMRWrappers
    model_type: KernelPV
    estimate_cate: true
    lam1: 0.01
    lam2: 0.01
    split_ratio: 0.5

  - name: PMMR-ATE
    cls: NMMRWrappers
    model_type: PMMR
    estimate_cate: false
    lam1: 0.01

  - name: PMMR-CATE
    cls: NMMRWrappers
    model_type: PMMR
    estimate_cate: true
    lam1: 0.01

  - name: NMMR-U
    cls: NMMR
    loss_name: U_statistic

  - name: NMMR-V
    cls: NMMR
    loss_name: V_statistic

  # - name: DFPV-ATE
  #   cls: DFPV

  # ── Tabular Causal Models ─────────────────────────────────────────────────
  - name: CausalFM
    cls:  CausalFM
    checkpoint: "CausalFM/checkpoints/checkpoints_standard/best_model.pth"
    use_W: false
    use_Z: false

  - name: DoPFN
    cls:  DoPFN
    use_W: true
    use_Z: true
  
  - name: CausalPFN
    cls:  CausalPFN
    use_W: true
    use_Z: true

# ── Neural model checkpoints ─────────────────────────────────────────────────

models: []
  # - name:       fungible_model
  #   checkpoint: checkpoints/fungible

  # - name:       NewModel
  #   checkpoint: checkpoints/cate_medium

  # - name:       ate_small
  #   checkpoint: checkpoints/ate_small