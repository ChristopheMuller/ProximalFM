# ─────────────────────────────────────────────────────────────────────────────
# bench_config.yaml — Single source of truth for the entire benchmark.
# ─────────────────────────────────────────────────────────────────────────────

# ── Data ──────────────────────────────────────────────────────────────────────
data:
  source: generate
  output_dir: results/tbd

  # ── Dataset sizes ────────────────────────────────────────────────────────
  n_rows: 2000
  n_batch: 10
  prop_train: 0.75

  # ── Prior (only used when source=generate; paste the one from the checkpoints)
  prior:
    batch_size: 1
    batch_size_per_gp: 1
    min_dim_U: 1
    max_dim_U: 2
    min_dim_W: 1
    max_dim_W: 2
    min_dim_Z: 1
    max_dim_Z: 2
    min_dim_X: 1
    max_dim_X: 2
    min_seq_len: None
    max_seq_len: 1024
    log_seq_len: False
    seq_len_per_gp: False
    min_train_size: 0.5
    max_train_size: 0.95
    replay_small: False
    prior_type: "mlp_scm"
    device: "cpu"


# ── Execution ─────────────────────────────────────────────────────────────────
run:
  seed:      999999999
  n_workers: 6
  device: mps
  force_rerun: false


# ── Methods ───────────────────────────────────────────────────────────────────
methods:

  # ── S-Learner baselines ──────────────────────────────────────────────────
  - name: S-OLS
    cls:   S_Learner
    base:  linear
    use_W: true
    use_Z: true

  # - name: S-OLS+AX
  #   cls:   S_Learner
