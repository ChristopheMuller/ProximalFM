# ─────────────────────────────────────────────────────────────────────────────
# bench_config_gen.yaml — Benchmark on FRESHLY GENERATED prior draws.
#
# Unlike bench_config_val.yaml (which loads a fixed, pre-built dataset), this
# config samples new datasets from the SCM prior at run time. The draw is
# reproducible from run.seed. Note: the generated data is cached as
# <output_dir>/data.pt on the first run; later runs reuse the cache unless
# you pass --force.
# ─────────────────────────────────────────────────────────────────────────────

# ── Data ──────────────────────────────────────────────────────────────────────
data:
  source: generate
  output_dir: results/prior_gen_v1

  # ── Dataset sizes ──────────────────────────────────────────────────────────
  n_rows: 1024
  n_batch: 100
  prop_train: 0.75

  # ── Prior (kwargs of proximalfm.prior.PriorDataset) ────────────────────────
  prior:
    prior_type: mlp_scm       # mlp_scm | tree_scm | mix_scm (0.7 / 0.3)
    batch_size_per_gp: 1      # fresh SCM hyperparameters for every dataset
    mcmc_cate: 200            # Monte-Carlo replicates behind the CATE labels
    min_dim_U: 1
    max_dim_U: 10
    min_dim_X: 1
    max_dim_X: 10
    min_dim_W: 1              # sampler still enforces dim_W >= dim_U
    max_dim_W: 10
    min_dim_Z: 1              # sampler still enforces dim_Z >= dim_U
    max_dim_Z: 10
    log_seq_len: false
    seq_len_per_gp: false
    replay_small: false

# ── Execution ─────────────────────────────────────────────────────────────────
run:
  seed:      999999999   # also seeds the prior draw (same seed => same datasets)
  n_workers: 6
  device: mps
  force_rerun: false

# ── Methods ───────────────────────────────────────────────────────────────────
methods:

  # ── S-Learner baselines ──────────────────────────────────────────────────
  - name: S-OLS
    cls:   S_Learner
    base:  linear
    use_W: false
    use_Z: false

  - name: S-OLS+AX
    cls:   S_Learner
    base:  linear
    use_W: false
    use_Z: false
    interactions: true

  - name: S-RF
    cls:   S_Learner
    base:  rf
    use_W: false
    use_Z: false

  - name: S-TabICL
    cls:   S_Learner
    base:  tabicl
    use_W: false
    use_Z: false

  - name: S-TabICL-Oracle
    cls:   S_Learner
    base:  tabicl
    use_W: false
    use_Z: false
    is_oracle: true

  # ── T-Learner baselines ──────────────────────────────────────────────────
  - name: T-OLS
    cls:   T_Learner
    base:  linear
    use_W: false
    use_Z: false

  - name: T-RF
    cls:   T_Learner
    base:  rf
    use_W: false
    use_Z: false

  # ── X-Learner baselines ──────────────────────────────────────────────────
  - name: X-RF
    cls:   X_Learner
    base:  rf
    use_W: false
    use_Z: false
    interactions: false

  # ── Proximal baselines ───────────────────────────────────────────────────
  - name: P2SLS
    cls:          P2SLS
    interactions: false

  - name: P-RF
    cls:          PLearner
    base:         rf
    n_splits:     2
    q_clip:       [-10.0, 10.0]
    refit_full_nuisance: false

  - name: KPV
    cls:         KernelPV
    tune_kernel_scale: true
    kernel_scale_min: 0.5
    kernel_scale_max: 2.0
    n_kernel_scale_search: 5
    outputs:
      - { name: KPV-XW,     strategy: paired }
      - { name: KPV-X-Wind, strategy: independent }
      - { name: KPV-X-Wcond, strategy: conditional }
      - { name: KPV-ATE,    strategy: marginal }

  - name: PMMR
    cls:         PMMR
    outputs:
      - { name: PMMR-XW,     strategy: paired }
      - { name: PMMR-X-Wind, strategy: independent }
      - { name: PMMR-X-Wcond, strategy: conditional }
      - { name: PMMR-ATE,    strategy: marginal }

  - name: NMMR-V
    cls:        NMMR
    n_epochs:   100
    tune:
      enabled:  true
      val_frac: 0.2
      n_trials: 1
      seed:     0
      grid:
        loss:         ["v_stat"]
        hidden_dim:    [32, 64, 128]
        n_layers:       [2, 3, 4]
        n_epochs:       [50, 100, 200]
        lr:           [0.001, 0.0005, 0.0001]
        weight_decay: [0.0, 0.0001, 0.001]
    outputs:
      - { name: NMMR-V-XW,    strategy: paired }
      - { name: NMMR-V-Wind,  strategy: independent }
      - { name: NMMR-V-Wcond, strategy: conditional }

  - name: NMMR-U
    cls:        NMMR
    n_epochs:   100
    tune:
      enabled:  true
      val_frac: 0.2
      n_trials: 1
      seed:     0
      grid:
        loss:         ["u_stat"]
        hidden_dim:    [32, 64, 128]
        n_layers:       [2, 3, 4]
        n_epochs:       [50, 100, 200]
        lr:          [0.001, 0.0005, 0.0001]
        weight_decay: [0.0, 0.0001, 0.001]
    outputs:
      - { name: NMMR-U-XW,    strategy: paired }
      - { name: NMMR-U-Wind,  strategy: independent }
      - { name: NMMR-U-Wcond, strategy: conditional }

  # - name: DFPV-XW
  #   cls:        DFPV
  #   strategy:   paired

  # - name: DFPV-X-Wind
  #   cls:        DFPV
  #   strategy:   independent

  # - name: DFPV-X-cond
  #   cls:        DFPV
  #   strategy:   conditional

  # - name: DFPV-ATE
  #   cls:        DFPV
  #   strategy:   marginal

  # - name: CausalForest
  #   cls:  CausalForest
  #   n_trees: 100
  #   min_leaf_size: 10
  #   max_depth: 10
  #   subsample_ratio: 0.7
  #   use_W: false
  #   use_Z: false
  #   n_jobs: 1

  # ── Tabular Causal Models ─────────────────────────────────────────────────
  - name: CausalFM
    cls:  CausalFM
    checkpoint: "CausalFM/checkpoints/checkpoints_standard/best_model.pth"
    use_W: false
    use_Z: false

  - name: DoPFN
    cls:  DoPFN
    use_W: false
    use_Z: false

  - name: CausalPFN
    cls:  CausalPFN
    use_W: false
    use_Z: false

# ── Neural model checkpoints ─────────────────────────────────────────────────

models:

  - name:       ProximalFM3
    checkpoint: mc_run_3_finetune/
    all: false

  - name:       ProximalFM4
    checkpoint: mc_run_4/
    all: false
