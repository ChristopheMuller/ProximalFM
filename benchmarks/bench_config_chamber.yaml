# ─────────────────────────────────────────────────────────────────────────────
# bench_config_chamber.yaml — Benchmark on a SINGLE real Causal Chambers CSV.
#
# Input is a CANONICAL file produced by:
#     python benchmarks/causal_chambers/prepare_chamber_csv.py --all
# which renames columns to U_1/X_1/W_1/Z_1/A/Y/Y0/Y1, makes A binary {0,1} and
# sets Y = Y1 if A else Y0 (exact consistency). Because the schema is canonical,
# the `columns:` block below is identical for every prepared file.
#
# ── READ THIS BEFORE INTERPRETING THE RESULTS TABLE ──────────────────────────
# 1. N_BATCH=1. Every "median over episodes" / "mean rank" number collapses to
#    this single run. It is a head-to-head on THIS condition, not a
#    variance/robustness claim.
# 2. This is an ATE benchmark, NOT a CATE benchmark. In all four chamber files
#    SD(tau)/ATE is 0.3–1% (see the .diagnostics.json next to each CSV), i.e.
#    the treatment effect is essentially constant and its residual variation is
#    measurement noise from Y0/Y1 being two separate physical reads.
#    Consequently nPEHE, CATE R² and Shape R² — all normalised by SD(tau) —
#    divide by noise and are NOT meaningful here; the `homogeneous` guard in
#    bench_metrics.py (threshold 1e-6) does not fire to protect you. The
#    reported "ATE Bias" column is likewise in SD(tau) units and so is inflated
#    ~40x. Use the raw ate_true / ate_pred / ate_bias columns in results.csv
#    and read the bias as a PERCENTAGE OF THE TRUE ATE.
# 3. What this data genuinely tests: removing confounding bias at the ATE
#    level. Unadjusted difference-in-means is off by -5.4% (strong_linear) and
#    +9.2% (strong_non_linear) — that is the signal a proximal method should
#    correct. The two weak_* files are off by only -0.4% / -0.8% and barely
#    discriminate between methods; prefer the strong_* files.
#
# To benchmark another prepared file, change data.csv_path AND data.output_dir.
# WARNING: if you change csv_path but reuse an output_dir that already contains
# data.pt, the cached data silently wins — pass --force when repointing.
# ─────────────────────────────────────────────────────────────────────────────

# ── Data ──────────────────────────────────────────────────────────────────────
data:
  source: csv
  csv_path: benchmarks/causal_chambers/data/prepared/strong_confounding_non_linear.csv
  output_dir: results/chamber_strong_confounding_non_linear

  prop_train: 0.75           # split is applied AFTER shuffling
  shuffle: true              # permute rows before the train/test split (seeded by run.seed)
  normalize_treatment: false # already binary {0,1} — prepare_chamber_csv.py did it

  # Canonical schema — same for every prepared chamber file.
  columns:
    X: [X_1]
    W: [W_1]
    Z: [Z_1]
    A: A
    Y: Y
    U: [U_1]      # optional — unobserved confounder, oracle-only (S-TabICL-Oracle)
    Y0: Y0        # ground-truth potential outcome under control (forced counterfactual)
    Y1: Y1        # ground-truth potential outcome under treatment (forced counterfactual)

# ── Execution ─────────────────────────────────────────────────────────────────
run:
  seed:      999999999   # also seeds the row shuffle (same seed => same split)
  n_workers: 6
  device: mps
  force_rerun: false

# ── Methods ───────────────────────────────────────────────────────────────────
methods:

  # ── S-Learner baselines ──────────────────────────────────────────────────
  - name: S-OLS
    cls:   S_Learner
    base:  linear
    use_W: false
    use_Z: false

  - name: S-OLS+AX
    cls:   S_Learner
    base:  linear
    use_W: false
    use_Z: false
    interactions: true

  - name: S-OLS+AX-Oracle
    cls:   S_Learner
    base:  linear
    use_W: false
    use_Z: false
    interactions: true
    is_oracle: true

  - name: S-RF
    cls:   S_Learner
    base:  rf
    use_W: false
    use_Z: false

  - name: S-RF-Oracle
    cls:   S_Learner
    base:  rf
    use_W: false
    use_Z: false
    is_oracle: true

  - name: S-TabICL
    cls:   S_Learner
    base:  tabicl
    use_W: false
    use_Z: false

  - name: S-TabICL-Oracle
    cls:   S_Learner
    base:  tabicl
    use_W: false
    use_Z: false
    is_oracle: true

  # ── T-Learner baselines ──────────────────────────────────────────────────
  - name: T-OLS
    cls:   T_Learner
    base:  linear
    use_W: false
    use_Z: false

  - name: T-RF
    cls:   T_Learner
    base:  rf
    use_W: false
    use_Z: false

  # ── X-Learner baselines ──────────────────────────────────────────────────
  - name: X-RF
    cls:   X_Learner
    base:  rf
    use_W: false
    use_Z: false
    interactions: false

  # ── Proximal baselines ───────────────────────────────────────────────────
  - name: P2SLS
    cls:          P2SLS
    interactions: false

  - name: P-RF
    cls:          PLearner
    base:         rf
    n_splits:     2
    q_clip:       [-10.0, 10.0]
    refit_full_nuisance: false

  - name: KPV
    cls:         KernelPV
    tune_kernel_scale: true
    kernel_scale_min: 0.5
    kernel_scale_max: 2.0
    n_kernel_scale_search: 5
    outputs:
      - { name: KPV-XW,     strategy: paired }
      - { name: KPV-X-Wind, strategy: independent }
      - { name: KPV-X-Wcond, strategy: conditional }
      - { name: KPV-ATE,    strategy: marginal }

  - name: PMMR
    cls:         PMMR
    outputs:
      - { name: PMMR-XW,     strategy: paired }
      - { name: PMMR-X-Wind, strategy: independent }
      - { name: PMMR-X-Wcond, strategy: conditional }
      - { name: PMMR-ATE,    strategy: marginal }

  - name: NMMR-V
    cls:        NMMR
    n_epochs:   100
    tune:
      enabled:  true
      val_frac: 0.2
      n_trials: 1
      seed:     0
      grid:
        loss:         ["v_stat"]
        hidden_dim:    [32, 64, 128]
        n_layers:       [2, 3, 4]
        n_epochs:       [50, 100, 200]
        lr:           [0.001, 0.0005, 0.0001]
        weight_decay: [0.0, 0.0001, 0.001]
    outputs:
      - { name: NMMR-V-XW,    strategy: paired }
      - { name: NMMR-V-Wind,  strategy: independent }
      - { name: NMMR-V-Wcond, strategy: conditional }

  - name: NMMR-U
    cls:        NMMR
    n_epochs:   100
    tune:
      enabled:  true
      val_frac: 0.2
      n_trials: 1
      seed:     0
      grid:
        loss:         ["u_stat"]
        hidden_dim:    [32, 64, 128]
        n_layers:       [2, 3, 4]
        n_epochs:       [50, 100, 200]
        lr:          [0.001, 0.0005, 0.0001]
        weight_decay: [0.0, 0.0001, 0.001]
    outputs:
      - { name: NMMR-U-XW,    strategy: paired }
      - { name: NMMR-U-Wind,  strategy: independent }
      - { name: NMMR-U-Wcond, strategy: conditional }

  # ── Tabular Causal Models ─────────────────────────────────────────────────
  - name: CausalFM
    cls:  CausalFM
    checkpoint: "CausalFM/checkpoints/checkpoints_standard/best_model.pth"
    use_W: false
    use_Z: false

  - name: DoPFN
    cls:  DoPFN
    use_W: false
    use_Z: false

  - name: CausalPFN
    cls:  CausalPFN
    use_W: false
    use_Z: false

# ── Neural model checkpoints ─────────────────────────────────────────────────

models:

  - name:       ProximalFM3
    checkpoint: mc_run_3_finetune/
    all: false

  - name:       ProximalFM4
    checkpoint: mc_run_4/
    all: false

  - name:       ProximalFM5
    checkpoint: mc_run_5/
    all: false
