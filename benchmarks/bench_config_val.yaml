# ─────────────────────────────────────────────────────────────────────────────
# bench_config.yaml — Single source of truth for the entire benchmark.
# ─────────────────────────────────────────────────────────────────────────────

# ── Data ──────────────────────────────────────────────────────────────────────
data:
  source: load
  val_dir: synt_eval/validation_data/val
  output_dir: synt_eval/validation_data/bench

# ── Execution ─────────────────────────────────────────────────────────────────
run:
  seed:      999999999
  n_workers: 6
  device: mps
  force_rerun: false

# ── Methods ───────────────────────────────────────────────────────────────────
methods:

  # ── S-Learner baselines ──────────────────────────────────────────────────
  - name: S-OLS
    cls:   S_Learner
    base:  linear
    use_W: false
    use_Z: false

  - name: S-OLS+AX
    cls:   S_Learner
    base:  linear
    use_W: false
    use_Z: false
    interactions: true

  - name: S-RF
    cls:   S_Learner
    base:  rf
    use_W: false
    use_Z: false

  - name: S-TabICL
    cls:   S_Learner
    base:  tabicl
    use_W: false
    use_Z: false

  # - name: S-TabICL-Oracle
  #   cls:   S_Learner
  #   base:  tabicl
  #   use_W: false
  #   use_Z: false
  #   is_oracle: true

  # ── T-Learner baselines ──────────────────────────────────────────────────
  - name: T-OLS
    cls:   T_Learner
    base:  linear
    use_W: false
    use_Z: false

  - name: T-RF
    cls:   T_Learner
    base:  rf
    use_W: false
    use_Z: false

  # ── X-Learner baselines ──────────────────────────────────────────────────
  - name: X-RF
    cls:   X_Learner
    base:  rf
    use_W: false
    use_Z: false
    interactions: false

  # ── Proximal baselines ───────────────────────────────────────────────────
  - name: P2SLS
    cls:          P2SLS
    interactions: false

  - name: P-RF
    cls:          PLearner
    base:         rf
    n_splits:     2
    q_clip:       [-10.0, 10.0]
    refit_full_nuisance: false

  # - name: KPV
  #   cls:         KernelPV
  #   tune_kernel_scale: true
  #   kernel_scale_min: 0.5
  #   kernel_scale_max: 2.0
  #   n_kernel_scale_search: 5
  #   outputs:
  #     - { name: KPV-XW,     strategy: paired }
  #     - { name: KPV-X-Wind, strategy: independent }
  #     - { name: KPV-X-Wcond, strategy: conditional }
  #     - { name: KPV-ATE,    strategy: marginal }

  - name: PMMR
    cls:         PMMR
    outputs:
      - { name: PMMR-XW,     strategy: paired }
      - { name: PMMR-X-Wind, strategy: independent }
      - { name: PMMR-X-Wcond, strategy: conditional }
      - { name: PMMR-ATE,    strategy: marginal }

  - name: NMMR-V
    cls:        NMMR
    n_epochs:   100
    tune:
      enabled:  true
      val_frac: 0.2
      n_trials: 1
      seed:     0
      grid:
        loss:         ["v_stat"]
        hidden_dim:    [32, 64, 128]
        n_layers:       [2, 3, 4]
        n_epochs:       [50, 100, 200]
        lr:           [0.001, 0.0005, 0.0001]
        weight_decay: [0.0, 0.0001, 0.001]
    outputs:
      - { name: NMMR-V-XW,    strategy: paired }
      - { name: NMMR-V-Wind,  strategy: independent }
      - { name: NMMR-V-Wcond, strategy: conditional }

  - name: NMMR-U
    cls:        NMMR
    n_epochs:   100
    tune:
      enabled:  true
      val_frac: 0.2
      n_trials: 1
      seed:     0
      grid:
        loss:         ["u_stat"]
        hidden_dim:    [32, 64, 128]
        n_layers:       [2, 3, 4]
        n_epochs:       [50, 100, 200]
        lr:          [0.001, 0.0005, 0.0001]
        weight_decay: [0.0, 0.0001, 0.001]
    outputs:
      - { name: NMMR-U-XW,    strategy: paired }
      - { name: NMMR-U-Wind,  strategy: independent }
      - { name: NMMR-U-Wcond, strategy: conditional }

  # - name: DFPV-XW
  #   cls:        DFPV
  #   strategy:   paired

  # - name: DFPV-X-Wind
  #   cls:        DFPV
  #   strategy:   independent

  # - name: DFPV-X-cond
  #   cls:        DFPV
  #   strategy:   conditional

  # - name: DFPV-ATE
  #   cls:        DFPV
  #   strategy:   marginal

  # - name: CausalForest
  #   cls:  CausalForest
  #   n_trees: 100
  #   min_leaf_size: 10
  #   max_depth: 10
  #   subsample_ratio: 0.7
  #   use_W: false
  #   use_Z: false
  #   n_jobs: 1

  # ── Tabular Causal Models ─────────────────────────────────────────────────
  - name: CausalFM
    cls:  CausalFM
    checkpoint: "CausalFM/checkpoints/checkpoints_standard/best_model.pth"
    use_W: false
    use_Z: false

  - name: DoPFN
    cls:  DoPFN
    use_W: false
    use_Z: false

  - name: CausalPFN
    cls:  CausalPFN
    use_W: false
    use_Z: false

# ── Neural model checkpoints ─────────────────────────────────────────────────

models:
  
