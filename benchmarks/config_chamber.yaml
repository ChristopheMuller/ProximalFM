  #   use_W: false
  #   use_Z: false
  #   compute: { n_jobs: 1 }

  # ── Tabular Causal Models ─────────────────────────────────────────────────
  - name: CausalFM
    cls:  CausalFM
    checkpoint: "CausalFM/checkpoints/checkpoints_standard/best_model.pth"
    use_W: false
    use_Z: false

  - name: DoPFN
    cls:  DoPFN
    use_W: false
    use_Z: false

  - name: CausalPFN
    cls:  CausalPFN
    use_W: false
    use_Z: false

  - name: CausalPFN-XWZ
    cls:  CausalPFN
    use_W: true
    use_Z: true

  - name: CausalPFN-XWU
    cls:  CausalPFN
    use_W: true
    use_Z: false
    is_oracle: true

