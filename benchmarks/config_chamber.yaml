# ─────────────────────────────────────────────────────────────────────────────
# config_chamber.yaml — Benchmark all prepared Causal Chambers CSVs.
#
# Inputs are CANONICAL files produced by:
#     python benchmarks/causal_chambers/prepare_chamber_csv.py --all
# which renames columns to U_1/X_1/W_1/Z_1/A/Y/Y0/Y1, makes A binary {0,1} and
# sets Y = Y1 if A else Y0 (exact consistency). Because the schema is canonical,
# the `columns:` block below is identical for every prepared file.
#
# ── READ THIS BEFORE INTERPRETING THE RESULTS TABLE ──────────────────────────
# 1. Each CSV is one episode. Files are fit and scored independently; ordinary
#    summary metrics are averaged over files with equal weight, rather than
#    concatenating their rows. ATE RMSE retains its pooled-RMS definition.
# 2. This is an ATE benchmark, NOT a CATE benchmark. In all 12 chamber files
#    SD(tau)/ATE is 0.3–1% (see the .diagnostics.json next to each CSV), i.e.
#    the treatment effect is essentially constant and its residual variation is
#    measurement noise from Y0/Y1 being two separate physical reads.
#    Consequently nPEHE, CATE R² and Shape R² — all normalised by SD(tau) —
#    divide by noise and are NOT meaningful here; the `homogeneous` guard in
#    metrics.py (threshold 1e-6) does not fire to protect you. The
#    reported "ATE Bias" column is likewise in SD(tau) units and so is inflated
#    ~40x. Use the raw ate_true / ate_pred / ate_bias columns in results.csv
#    and read the bias as a PERCENTAGE OF THE TRUE ATE.
# 3. What this data genuinely tests: removing confounding bias at the ATE
#    level. The weak-confounding files discriminate less strongly between
#    methods; use `csv_paths` if only the strong-confounding runs are wanted.
#
# To benchmark a subset, use `csv_paths: [...]` instead of `csv_dir`.
# WARNING: if you change the inputs but reuse an output_dir that already contains
# data.pt, the cached data silently wins — pass --force when repointing.
# ─────────────────────────────────────────────────────────────────────────────

# ── Data ──────────────────────────────────────────────────────────────────────
data:
  source: csv
  csv_dir: benchmarks/causal_chambers/data/prepared
  csv_pattern: "*.csv"
  output_dir: results/causal_chambers_all

  prop_train: 0.75           # split is applied AFTER shuffling
  shuffle: true              # permute rows before the train/test split (seeded by run.seed)
  normalize_treatment: false # already binary {0,1} — prepare_chamber_csv.py did it

  # Canonical schema — same for every prepared chamber file.
  columns:
    X: [X_1]
    W: [W_1]
    Z: [Z_1]
    A: A
    Y: Y
    U: [U_1]      # optional — unobserved confounder, oracle-only (S-TabICL-Oracle)
    Y0: Y0        # ground-truth potential outcome under control (forced counterfactual)
    Y1: Y1        # ground-truth potential outcome under treatment (forced counterfactual)

# ── Execution ─────────────────────────────────────────────────────────────────
# `compute` is the run-wide default; any method or model entry may overlay its own
# `compute:` block. See config_val.yaml for the field-by-field notes, and
# benchmarks/compute.py — the single owner of device and thread counts.
run:
  seed:      999999999   # also seeds the row shuffle (same seed => same split)
  force_rerun: false
  compute:
    device:        cpu
    n_workers:     6
    torch_threads: 1
    blas_threads:  1
    n_jobs:        1

# Use literal equal-weight means for the ordinary per-episode metrics. Metrics
# defined as pooled RMS (notably ATE RMSE) retain that mathematically required
# aggregation instead of being silently changed into a mean absolute error.
eval:
  episode_aggregation: mean

# ── Methods ───────────────────────────────────────────────────────────────────
methods:

  # ── S-Learner baselines ──────────────────────────────────────────────────
  - name: S-OLS
    cls:   S_Learner
    base:  linear
    use_W: false
    use_Z: false

  - name: S-OLS-WZ-Oracle
    cls:   S_Learner
    base:  linear
    use_W: true
    use_Z: true
    is_oracle: true

  - name: S-RF
    cls:   S_Learner
    base:  rf
    use_W: false
    use_Z: false

  - name: S-RF-WZ
    cls:   S_Learner
    base:  rf
    use_W: true
    use_Z: true

  - name: S-RF-Oracle
    cls:   S_Learner
    base:  rf
    use_W: false
    use_Z: false
    is_oracle: true

  - name: S-RF-ITE-Oracle
    cls:   S_Learner
    base:  rf
    use_W: true
    use_Z: true
    is_oracle: true

  - name: S-TabICL
    cls:   S_Learner
    base:  tabicl
    use_W: false
    use_Z: false
    tabicl: { kv_cache: true }
    compute: { torch_threads: 2 }

  # - name: S-TabICL-Oracle
  #   cls:   S_Learner
  #   base:  tabicl
  #   use_W: false
  #   use_Z: false
  #   is_oracle: true

  - name: S-TabICL-XWU
    cls:   S_Learner
    base:  tabicl
    use_W: true
    use_Z: false
    is_oracle: true
    tabicl: { kv_cache: true }
    compute: { torch_threads: 2 }

  # ── T-Learner baselines ──────────────────────────────────────────────────
  - name: T-OLS
    cls:   T_Learner
    base:  linear
    use_W: false
    use_Z: false

  - name: T-OLS-WZ
    cls:   T_Learner
    base:  linear
    use_W: true
    use_Z: true

  - name: T-OLS-Oracle
    cls:   T_Learner
    base:  linear
    use_W: false
    use_Z: false
    is_oracle: true

  - name: T-OLS-WZ-Oracle
    cls:   T_Learner
    base:  linear
    use_W: true
    use_Z: true
    is_oracle: true

  - name: T-RF
    cls:   T_Learner
    base:  rf
    use_W: false
    use_Z: false

  # ── X-Learner baselines ──────────────────────────────────────────────────
  - name: X-RF
    cls:   X_Learner
    base:  rf
    use_W: false
    use_Z: false
    interactions: false

  - name: X-RF-W
    cls:   X_Learner
    base:  rf
    use_W: true
    use_Z: false
    interactions: false

  - name: X-RF-Oracle
    cls:   X_Learner
    base:  rf
    use_W: false
    use_Z: false
    is_oracle: true
    interactions: false

  - name: X-RF-WZ-Oracle
    cls:   X_Learner
    base:  rf
    use_W: true
    use_Z: true
    is_oracle: true
    interactions: false

  - name: X-TabICL
    cls:   X_Learner
    base:  tabicl
    use_W: false
    use_Z: false
    interactions: false

  # ── Proximal baselines ───────────────────────────────────────────────────
  - name: P2SLS
    cls:          P2SLS
    interactions: false

  - name: P-Kernel
    cls:      PLearner
    bridge:   kernel
    n_splits: 4
    q_clip:   20.0
    bridge_params: { rank: 256, lam_grid: [1.0e-6, 1.0e-5, 1.0e-4, 0.001, 0.01, 0.1] }
    base_cv:
      folds: 4
      seed: 1234
      grids:
        linear: { alpha: [0.1, 1.0, 10.0, 100.0, 1000.0] }
        rf:
          n_estimators: [100]
          max_depth: [1, 2, 3, 5]
          min_samples_leaf: [1, 5, 10]
          max_features: [1.0]
    compute: { n_workers: 1 }
    outputs:
      - { name: P-Kernel-RF,  base: rf }
      - { name: P-Kernel-OLS, base: linear }
      - { name: P-Kernel-ATE, kind: ate }

  - name: KPV
    cls:         KernelPV
    compute: { n_workers: 1 }
    tune:
      enabled:  true
      n_trials: 1
      seed:     1234
      grid:
        kernel_scale: [1.0]
    outputs:
      - { name: KPV-XW,     strategy: paired }
      - { name: KPV-X-Wind, strategy: independent }
      - { name: KPV-X-Wcond, strategy: conditional }
      - { name: KPV-ATE,    strategy: marginal }

  - name: PMMR
    cls:         PMMR
    compute: { n_workers: 1 }
    tune:
      enabled:  true
      val_frac: 0.2
      n_trials: 12
      seed:     1234
      grid:
        kernel_scale:   [0.6, 0.8, 1.0, 1.2]
        kernel_scale_z: [0.8, 1., 1.2]
      sweep:
        lam1:           [0.00001, 0.0001, 0.001, 0.01, 0.1]
    outputs:
      - { name: PMMR-XW,     strategy: paired }
      - { name: PMMR-X-Wind, strategy: independent }
      - { name: PMMR-X-Wcond, strategy: conditional }
      - { name: PMMR-ATE,    strategy: marginal }

  - name: NMMR-V-fixed
    cls:          NMMR
    loss:         v_stat
    kernel_width: fixed
    tune:
      enabled:  true
      val_frac: 0.2
      n_trials: 10
      seed:     1234
      grid:
        hidden_dim:    [16, 32, 64]
        n_layers:      [2, 4, 6]
        lr:            [0.001, 0.005]
        weight_decay:  [0.0001]
      sweep:
        n_epochs:      [25, 50, 75, 100]
    outputs:
      - { name: NMMR-V-fixed-XW,    strategy: paired }
      - { name: NMMR-V-fixed-Wind,  strategy: independent }
      - { name: NMMR-V-fixed-Wcond, strategy: conditional }

  # - name: NMMR-V-median
  #   cls:          NMMR
  #   loss:         v_stat
  #   kernel_width: median
