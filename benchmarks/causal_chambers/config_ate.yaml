# Causal Chambers: full-context, physical ATE benchmark.
#
# Each CSV is one physical operating condition.  A method receives all factual
# (X, W, Z, A, Y) rows in that file, then its estimated contrast is averaged
# over the same rows.  Y0/Y1 are used only for the paired intervention
# reference; they are never passed to an estimator.
run:
  seed: 20260916
  compute:
    device: cpu
    n_workers: 1
    torch_threads: 1
    blas_threads: 1
    n_jobs: 1

# Context prefixes are nested within one deterministic row order. The paired
# intervention reference is recomputed on the same prefix, so it is an
# empirical ATE that correctly varies with n_ctx. Extra permutations are an
# optional robustness check, not part of the default learning curve.
ate:
  context_sizes: [128, 256, 512, 1000]
  n_permutations: 1

data:
  csv_dir: benchmarks/causal_chambers/data
  csv_pattern: out_binaryA_counterfactuals_*_smoothA_a350.csv
  columns:
    U: green                 # oracle-only
    X: red
    W: pol_1
    Z: led_2_uv
    A: led_3_uv
    Y: ir_3                  # factual physical sensor measurement
    Y0: Y0                   # paired forced-control measurement, reference only
    Y1: Y1                   # paired forced-treated measurement, reference only

output_dir: benchmarks/causal_chambers/results/ate

methods:
  - name: P2SLS
    cls: P2SLS

  - name: S-TabICL
    cls: S_Learner
    base: tabicl
    use_W: true
    use_Z: true
    tabicl: {kv_cache: true, n_estimators: 1}
    compute: {torch_threads: 2}

  - name: S-RF
    cls: S_Learner
    base: rf
    use_W: true
    use_Z: true
    base_cv:
      folds: 4
      seed: 1234
      grids:
        rf:
          n_estimators: [100]
          max_depth: [1, 3, 5]
          min_samples_leaf: [1, 5, 10]
          max_features: [1.0]

  - name: T-OLS
    cls: T_Learner
    base: linear
    use_W: true
    use_Z: true
    base_cv:
      folds: 4
      seed: 1234
      grids:
        linear: { alpha: [0.1, 1.0, 10.0, 100.0, 1000.0] }

  - name: T-RF
    cls: T_Learner
    base: rf
    use_W: true
    use_Z: true
    base_cv:
      folds: 4
      seed: 1234
      grids:
        rf:
          n_estimators: [100]
          max_depth: [1, 3, 5]
          min_samples_leaf: [1, 5, 10]
          max_features: [1.0]

  - name: T-TabICL
    cls: T_Learner
    base: tabicl
    use_W: true
    use_Z: true
    tabicl: {kv_cache: true, n_estimators: 1}
    compute: {torch_threads: 2}

  - name: X-RF
    cls: X_Learner
    base: rf
    use_W: true
    use_Z: true
    base_cv:
      folds: 4
      seed: 1234
      grids:
        rf:
          n_estimators: [100]
          max_depth: [1, 3, 5]
          min_samples_leaf: [1, 5, 10]
          max_features: [1.0]

  - name: X-TabICL
    cls: X_Learner
    base: tabicl
    use_W: true
    use_Z: true
    tabicl: {kv_cache: true, n_estimators: 1}
    compute: {torch_threads: 2}

  - name: CausalPFN-XWZ
    cls: CausalPFN
    use_W: true
    use_Z: true

  - name: DoPFN-XWZ
    cls: DoPFN
    use_W: true
    use_Z: true

  - name: CausalFM-XWZ
    cls: CausalFM
    checkpoint: CausalFM/checkpoints/checkpoints_standard/best_model.pth
    use_W: true
    use_Z: true

  - name: KPV-ATE
    cls: KernelPV
    strategy: marginal
    compute: {n_workers: 1}
    tune:
      enabled: true
      n_trials: 3
      seed: 1234
      grid:
        kernel_scale: [0.8, 1.0, 1.2]